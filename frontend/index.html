<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt to Plot</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="plotly-2.32.0.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Prompt to Plot</h1>
            <p>Autonomous Agentic Business Intelligence</p>
        </header>
        
        <main>
            <div class="data-source-section glass-panel">
                <div class="ds-header">
                    <h3>Data Source</h3>
                    <span id="current-ds-badge" class="badge default-badge">Default Sales DB</span>
                </div>
                
                <div class="tabs">
                    <button class="tab-btn active" data-tab="upload">File Upload</button>
                    <button class="tab-btn" data-tab="url">URL / S3</button>
                    <button class="tab-btn" data-tab="postgres">PostgreSQL</button>
                </div>
                
                <div class="tab-content active" id="tab-upload">
                    <div class="upload-wrapper">
                        <input type="file" id="file-input" accept=".csv,.xlsx,.json,.parquet" />
                        <button id="upload-btn" class="secondary-btn">Load File</button>
                    </div>
                    <small>Supported: CSV, Excel (.xlsx), JSON, Parquet (Max 50MB)</small>
                </div>
                
                <div class="tab-content" id="tab-url">
                    <div class="input-wrapper">
                        <input type="text" id="url-input" placeholder="https://... or s3://... or Google Sheets URL" />
                        <button id="url-btn" class="secondary-btn">Connect</button>
                    </div>
                </div>
                
                <div class="tab-content" id="tab-postgres">
                    <div class="pg-form">
                        <input type="text" id="pg-host" placeholder="Host (e.g. localhost)" />
                        <input type="number" id="pg-port" placeholder="Port" value="5432" />
                        <input type="text" id="pg-dbname" placeholder="DB Name" />
                        <input type="text" id="pg-user" placeholder="User" />
                        <input type="password" id="pg-password" placeholder="Password" />
                        <input type="text" id="pg-table" placeholder="Table Name" />
                        <button id="pg-btn" class="secondary-btn">Connect DB</button>
                    </div>
                </div>
                
                <div id="ds-status" class="ds-status hidden"></div>
            </div>

            <div class="input-section glass-panel">
                <input type="text" id="prompt-input" placeholder="Ask a question about your data (e.g. 'Show me top regions by revenue')" autofocus autocomplete="off" />
                <button id="analyze-btn">Analyze</button>
            </div>
            
            <div id="status-container" class="status-container hidden">
                <div class="spinner"></div>
                <span id="status-text">Agent is thinking...</span>
            </div>
            
            <div id="error-container" class="error-container hidden glass-panel">
                <h3>Agent Failed</h3>
                <p id="error-text"></p>
            </div>

            <div id="results-section" class="results-section hidden">
                <div class="chart-container glass-panel">
                    <div id="plotly-div"></div>
                </div>
                
                <div class="insight-container glass-panel">
                    <h3>Data Insight</h3>
                    <div class="insight-grid">
                        <div class="insight-card">
                            <h4>Fact</h4>
                            <p id="fact-text"></p>
                        </div>
                        <div class="insight-card">
                            <h4>Insight</h4>
                            <p id="insight-text"></p>
                        </div>
                        <div class="insight-card">
                            <h4>Potential Action</h4>
                            <p id="action-text"></p>
                        </div>
                    </div>
                </div>

                <details class="sql-container glass-panel">
                    <summary>View Execution Trace (Generated SQL)</summary>
                    <pre><code id="sql-text"></code></pre>
                </details>
            </div>
        </main>
    </div>
    <script src="app.js?v=3"></script>
</body>
</html>
